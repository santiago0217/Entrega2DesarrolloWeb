<h1>{{ id() ? 'Editar reserva #' + id() : 'Nueva reserva' }}</h1>

<div role="alert">
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
</div>

@if (opciones(); as opciones) {
  @if (!id() || registro()) {
    <app-reserva-form
      [opciones]="opciones"
      [registro]="registro()"
      (guardado)="guardar($event)"
      (cancelado)="volver()"
    />
  }
} @else if (!error()) {
  <p class="cargando">Cargando...</p>
}
